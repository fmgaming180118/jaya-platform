[project]
name = "jaya-research"
version = "0.1.0"
description = "JAYA Research Platform - Knowledge Discovery, Evolution, and Experimentation"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    # Core
    "numpy>=1.26,<3",
    "numba>=0.60.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0",
    # API & Backend
    "fastapi>=0.115,<1",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9",
    # Data & Web
    "youtube-transcript-api>=0.6",
    "networkx>=3.2",
    "yt-dlp>=2024.1",
    "beautifulsoup4>=4.12",
    "pydantic>=2.10,<3",
    "opencv-python>=4.9",
    "requests>=2.32,<3",
    # System Tray
    "pystray>=0.19",
    "Pillow>=10.0",
    # Advanced RAG & Voice
    "pipecat-ai>=0.0.50",
    "pyaudio>=0.2.13",
    "openwakeword>=0.5.0",
    "resemblyzer>=0.1.4",
    "scipy>=1.11.0",
    "sounddevice>=0.4.6",
    "SpeechRecognition>=3.10.0",
    "psutil>=5.9.0",
    "AppOpener>=1.7",
    # Security
    "cryptography>=43,<47",
    "argon2-cffi>=23.1.0",
    "msgpack>=1.1,<2",
    "pycryptodome>=3.21,<4",
    # Voice & Agentic RAG
    "pyttsx3>=2.90",
    "duckduckgo-search>=5.0.0",
    "googlesearch-python>=1.2.0",
    "gTTS>=2.5.0",
    "edge-tts>=6.1.9",
    "soundfile>=0.12.0",
    "faiss-cpu>=1.7.4",
    "cython>=3.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pdf2image>=1.16.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "tabulate>=0.9.0",
    # JAYA Internal
    "jaya-core>=0.1.0",
    "jaya-agent>=0.1.0",
    "jaya-os>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-benchmark>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyright>=1.1",
    "bandit>=1.7",
    "pre-commit>=3.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
torch = [
    "torch>=2.3",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
]
llama = [
    "llama-cpp-python>=0.2.70",
]
gpu = [
    "faiss-gpu>=1.7.4",
    "torch>=2.3",
]
full = [
    "torch>=2.3",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.11",
    "llama-cpp-python>=0.2.70",
    "faiss-gpu>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib -v"
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "integration: crosses a process, provider, model, or subsystem boundary",
    "network: requires live network access",
    "hardware: requires audio, GPU, camera, device, or other physical hardware",
    "manual: requires explicit human observation or interaction",
    "slow: intentionally long-running validation",
    "e2e: end-to-end system tests",
    "performance: performance benchmarks",
    "chaos: chaos engineering tests",
]
