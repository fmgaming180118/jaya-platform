name: JAYA Native Core Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-core:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest safetensors
        
    - name: Run Core Architecture DNA Test
      run: |
        pytest JAYA_CORE/tests/test_architecture_contract.py -v
        
    - name: Run Native Core Isolation Tests
      run: |
        pytest JAYA_CORE/tests/test_native_core.py -v
        
    - name: Run Smoke Test for Librarian Trainer
      run: |
        python -m JAYA_CORE.src.model.training.librarian_trainer --smoke-test --epochs 1 --steps 5
        
    - name: Run Killer Test 1 - Unseen Book
      run: |
        pytest JAYA_CORE/tests/test_unseen_book.py -v
        
    - name: Run Killer Test 2 - Unseen Code Repo
      run: |
        pytest JAYA_CORE/tests/test_unseen_code_repo.py -v
