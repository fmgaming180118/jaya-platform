system:
  vram_limit_mb: 1024
  use_gpu: true
  log_level: "INFO"

teacher:
  provider: "nvidia_nim"
  # Models are now loaded strictly from .env (NVIDIA_LLAMA31_MODEL, etc)
  api_base: "https://integrate.api.nvidia.com/v1"

student:
  framework: "tinygrad"
  model_path: "models/micro_agi_v1.safetensors"
  context_window: 2048
  learning_rate: 0.0003
